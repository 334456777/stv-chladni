# 在 Windows 上测试并用 scripts/package.ps1 打发布包，发布包上传为运行记录里的 Artifact。
# 推送 v* 标签时另建一个附带发布包的 Release 草稿，标签必须与 Cargo.toml 的版本一致。
name: 打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/package.ps1'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # 发布包里的 ffmpeg：gyan.dev 的完整共享库版，从它在 GitHub 上的镜像下载
  FFMPEG_VERSION: '7.1.1'
  FFMPEG_SHA256: 9f28727e8b472a04c1d2e520aaa425dca82721b995139b35710091130ea6e699

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 检查标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "标签 $env:GITHUB_REF_NAME 与 Cargo.toml 的版本 $version 不一致" }

      - name: 安装 Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/dist
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 测试
        run: cargo test --release --locked

      - name: 下载 ffmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-full_build-shared.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) { throw "下载的 ffmpeg SHA-256 为 $hash，与 FFMPEG_SHA256 不符" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP

      - name: 打包
        shell: pwsh
        run: pwsh -File scripts/package.ps1 -Ffmpeg "$env:RUNNER_TEMP\ffmpeg-$env:FFMPEG_VERSION-full_build-shared\bin\ffmpeg.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stv-windows-x86_64
          path: target/dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stv-windows-x86_64
          path: dist

      - name: 创建 Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip=$(ls dist/*.zip)
          hash=$(sha256sum "$zip" | cut -d' ' -f1)
          gh release create "$TAG" "$zip" --repo "$GITHUB_REPOSITORY" --draft --title "stv ${TAG#v}" \
            --notes "SHA-256：\`$hash\`  $(basename "$zip")"
